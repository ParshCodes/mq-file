[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mq-fileprocessing-harness"
version = "1.0.0"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the Docker Compose stack"]
addopts = "-ra"
timeout = 120
